<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>黑河市档案馆 · 读者登记</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <div class="archive-window">
    <div class="archive-header">黑河市档案馆 · 2009 年版 · 读者登记系统 v2.1.4</div>
    <div class="archive-body">
      <h2>读者身份核验</h2>
      <p class="hint">请填写查询人姓名 + 18 位身份证号。系统会自动核验访问权限。</p>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="name">查询人姓名</label>
          <input type="text" id="name" maxlength="20" placeholder="请输入您的真实姓名">
        </div>
        <div class="field">
          <label for="id">身份证号 (18 位)</label>
          <input type="text" id="id" maxlength="18" placeholder="请输入 18 位身份证号">
        </div>
        <div class="err" id="err">姓名或身份证号错误，请检查输入。</div>
        <button type="submit" class="archive-btn">登 录 系 统</button>
      </form>

      <p class="archive-hint-tip">
        💡 <em>提示：本馆支持凭真实姓名 + 有效身份证号进入。系统不存任何个人信息；查询记录仅用于内部审计。</em><br>
        🕒 服务时间：周一至周五 8:30-17:00 &nbsp;&nbsp; ☎ 0456-7890xxx
      </p>
    </div>
  </div>
  <div class="scanlines"></div>
  <script src="js/core.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const id = document.getElementById("id").value.trim();
      const err = document.getElementById("err");
      if (name === NA.PASSWORDS.archive.name && id === NA.PASSWORDS.archive.id) {
        // 写身份到 localStorage（仅姓名 + 身份证哈希，不写真实）
        NA.PLAYER = { name, id };
        localStorage.setItem(NA.LS_KEYS.identity, JSON.stringify(NA.PLAYER));
        NA.saveProgress("logged_in");
        NA.go("search");
      } else {
        err.classList.add("show");
        err.textContent = "姓名或身份证号错误，或您不在本馆 2009 年度查询授权名单内。";
        setTimeout(() => {
          err.classList.remove("show");
        }, 3000);
      }
    });
  </script>
</body>
</html>
