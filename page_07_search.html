function doSearch() {
  const q = document.getElementById('qInput').value.trim();
  const results = document.getElementById('results');
  if (!q) {
    results.innerHTML = '<p style="text-align:center; color:#888; padding:30px;">请输入关键词</p>';
    return;
  }
  const matches = DATA.filter(d => d.keywords.some(k => k.toLowerCase().includes(q.toLowerCase()) || q.toLowerCase().includes(k.toLowerCase())));
  if (matches.length === 0) {
    results.innerHTML = `<p style="text-align:center; color:#888; padding:30px;">没有找到与 "${q}" 相关的内容</p>`;
    return;
  }
  results.innerHTML = matches.map(m => `
    <div class="result-item">
      <a href="${m.url}" class="result-title">${m.title}</a>
      <div class="result-meta">作者: <b>${m.author}</b> · ${m.time} · 板块: ${m.board}</div>
      <div class="result-preview">匹配关键词: <span class="highlight">${m.keywords.filter(k => k.toLowerCase().includes(q.toLowerCase()) || q.toLowerCase().includes(k.toLowerCase())).join(' / ')}</span></div>
    </div>
  `).join('');
}

// 读取 ?q= 参数
const urlQ = new URLSearchParams(location.search).get('q');
if (urlQ) {
  document.getElementById('qInput').value = urlQ;
  doSearch();
