<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacBook 锁屏 - 失联</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231a1a2e'/%3E%3Ctext x='50' y='72' font-size='68' font-weight='bold' text-anchor='middle' fill='%23ff6b9d' font-family='Arial,sans-serif'%3E%E9%9B%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<div class="mac-lock">
  <div class="mac-status">
    <span>● ● ● ● ● ●</span>
    <span>100%</span>
  </div>

  <div class="mac-time" id="macTime">12:00</div>
  <div class="mac-date" id="macDate">2024 年 8 月 15 日 星期四</div>

  <div class="mac-prompt">⚡︎ 输入密码解锁</div>

  <div class="mac-pin-dots" id="pinDots">
    <div class="mac-pin-dot"></div>
    <div class="mac-pin-dot"></div>
    <div class="mac-pin-dot"></div>
    <div class="mac-pin-dot"></div>
  </div>

  <div class="mac-error" id="macError"></div>

  <div class="mac-keypad" id="macKeypad">
    <div class="mac-key" data-num="1">1</div>
    <div class="mac-key" data-num="2">2</div>
    <div class="mac-key" data-num="3">3</div>
    <div class="mac-key" data-num="4">4</div>
    <div class="mac-key" data-num="5">5</div>
    <div class="mac-key" data-num="6">6</div>
    <div class="mac-key" data-num="7">7</div>
    <div class="mac-key" data-num="8">8</div>
    <div class="mac-key" data-num="9">9</div>
    <div class="mac-key empty"></div>
    <div class="mac-key" data-num="0">0</div>
    <div class="mac-key backspace" id="backspaceKey">⌫</div>
  </div>

  <div class="mac-attempts" id="macAttempts">已尝试 0 次</div>

  <div class="mac-key-hint">
    💡 姐姐常用 4 位数字密码. 你试过她生日 (0915) 没用, 你的生日 (0902) 也没用.<br>
    <strong>线索在姐姐的大学网名上:</strong> 她的网名叫什么? 你记得是 4 个字.
  </div>
</div>

<script src="js/core.js"></script>
</body>
</html>
