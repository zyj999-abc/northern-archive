<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>查楠手机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, 'Segoe UI', Roboto, sans-serif;
        }

        .iphone {
            width: 100%;
            max-width: 390px;
            height: 844px;
            background: black;
            border-radius: 44px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5), 0 0 0 8px #2c2c2e;
        }

        .wallpaper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, #1b2b3f, #0a0c10);
            z-index: 0;
        }

        .dynamic-island {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 35px;
            background: rgba(0,0,0,0.65);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: white;
        }

        .time-container {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .time { font-size: 84px; font-weight: 600; letter-spacing: -2px; line-height: 1; }
        .date { font-size: 18px; font-weight: 500; margin-top: 8px; opacity: 0.85; }

        .lock-hint {
            position: absolute;
            bottom: 220px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            z-index: 10;
        }

        .passcode-container {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: all 0.25s ease;
        }

        .passcode-dots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .dot {
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.45);
            border-radius: 50%;
            transition: 0.1s ease;
        }
        .dot.filled { background: white; box-shadow: 0 0 6px rgba(255,255,255,0.8); }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            row-gap: 20px;
            margin-bottom: 28px;
            justify-items: center;
            align-items: center;
        }

        .key {
            background: rgba(110, 110, 128, 0.35);
            backdrop-filter: blur(15px);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            cursor: pointer;
            transition: 0.08s linear;
        }
        .key:active { background: rgba(255,255,255,0.45); transform: scale(0.96); }
        .key.delete { background: rgba(90,90,110,0.5); font-size: 20px; }

        .error-shake { animation: shake 0.1s ease-in-out 0s 2; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 450px) {
            .key { width: 68px; height: 68px; font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="iphone">
    <div class="wallpaper"></div>
    <div class="dynamic-island"><span> ● ● ● ●</span></div>

    <div class="time-container">
        <div class="time" id="liveTime">10:38</div>
        <div class="date" id="liveDate">2026年07月01日</div>
    </div>
    <div class="lock-hint"><span>⚡︎ 输入密码解锁</span></div>

    <div class="passcode-container" id="passcodeContainer">
        <div class="passcode-dots" id="dotContainer">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad" id="keypad">
            <div class="key" data-value="1">1</div><div class="key" data-value="2">2</div><div class="key" data-value="3">3</div>
            <div class="key" data-value="4">4</div><div class="key" data-value="5">5</div><div class="key" data-value="6">6</div>
            <div class="key" data-value="7">7</div><div class="key" data-value="8">8</div><div class="key" data-value="9">9</div>
            <div class="key" data-value="" style="background:transparent; box-shadow:none; cursor:default;"></div>
            <div class="key" data-value="0">0</div>
            <div class="key delete" data-action="delete">⌫</div>
        </div>
    </div>
</div>

<script>
    // 实时时间（仅小时和分钟实时更新，日期固定为2026年7月1日）
    function updateTime() {
        const now = new Date();
        const h = now.getHours().toString().padStart(2,'0');
        const m = now.getMinutes().toString().padStart(2,'0');
        document.getElementById('liveTime').textContent = `${h}:${m}`;
        // 固定日期，不再更新
        // document.getElementById('liveDate').textContent = `${y}年${mon}月${d}日`;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // 密码：0625
    const correctPasscode = '0625';
    let current = '';
    const dots = document.querySelectorAll('.dot');
    const box = document.getElementById('passcodeContainer');

    document.getElementById('keypad').addEventListener('click', e => {
        const k = e.target.closest('.key');
        if (!k) return;

        if (k.dataset.action === 'delete') {
            if (current.length > 0) {
                current = current.slice(0,-1);
                dots[current.length].classList.remove('filled');
            }
            return;
        }

        const v = k.dataset.value;
        if (v && current.length < 4) {
            current += v;
            dots[current.length-1].classList.add('filled');

            if (current.length === 4) {
                if (current === correctPasscode) {
                    window.location.href = 'shouji.html';
                } else {
                    box.classList.add('error-shake');
                    setTimeout(() => {
                        box.classList.remove('error-shake');
                        current = '';
                        dots.forEach(d => d.classList.remove('filled'));
                    }, 300);
                }
            }
        }
    });
</script>

</body></html>
